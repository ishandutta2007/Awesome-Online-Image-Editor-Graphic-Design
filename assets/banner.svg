<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-2deg); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -60; }
    }
    .orb-purple {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 950px 100px;
    }
    .orb-cyan {
      animation: pulseOrb 10s ease-in-out infinite alternate;
      transform-origin: 150px 280px;
    }
    .float-1 {
      animation: floatCard1 6s ease-in-out infinite;
    }
    .float-2 {
      animation: floatCard2 7s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dashMove 4s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#gridPattern)" rx="16" />

  <!-- Animated Ambient Orbs in Background -->
  <g>
    <circle class="orb-purple" cx="980" cy="90" r="140" fill="url(#primaryGrad)" filter="url(#glow)" />
    <circle class="orb-cyan" cx="120" cy="280" r="110" fill="url(#neonCyan)" filter="url(#glow)" />
  </g>

  <!-- Decorative Background Design Elements (Behind Foreground Content) -->
  <g opacity="0.35">
    <path class="flow-line" d="M 50 180 Q 300 40 600 180 T 1150 160" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="flow-line" d="M 80 230 Q 350 310 680 210 T 1120 270" fill="none" stroke="#ec4899" stroke-width="1.5" />
  </g>

  <!-- Right Side Floating Design Canvas Mockup / Card -->
  <g class="float-1" transform="translate(860, 48)">
    <rect width="280" height="180" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1.5" filter="url(#glow)" />
    <!-- Window controls -->
    <circle cx="20" cy="20" r="4.5" fill="#ef4444" />
    <circle cx="36" cy="20" r="4.5" fill="#f59e0b" />
    <circle cx="52" cy="20" r="4.5" fill="#10b981" />
    <rect x="75" y="14" width="120" height="12" rx="4" fill="#334155" />
    
    <!-- Canvas workspace content -->
    <rect x="20" y="42" width="240" height="118" rx="6" fill="#0f172a" />
    <!-- Gradient banner artwork inside preview -->
    <rect x="35" y="55" width="210" height="52" rx="4" fill="url(#primaryGrad)" opacity="0.85" />
    <circle cx="70" cy="81" r="16" fill="#ffffff" opacity="0.9" />
    <rect x="100" y="70" width="85" height="8" rx="3" fill="#ffffff" opacity="0.95" />
    <rect x="100" y="84" width="55" height="6" rx="3" fill="#e2e8f0" opacity="0.75" />
    <!-- Tools icons / elements -->
    <rect x="35" y="120" width="38" height="24" rx="4" fill="#334155" />
    <rect x="80" y="120" width="38" height="24" rx="4" fill="#334155" />
    <rect x="125" y="120" width="38" height="24" rx="4" fill="#6366f1" />
    <rect x="170" y="120" width="75" height="24" rx="4" fill="#10b981" />
  </g>

  <!-- Smaller Second Floating Card (Layers / Color Palette) -->
  <g class="float-2" transform="translate(810, 185)">
    <rect width="180" height="125" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.5" />
    <text x="18" y="26" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="bold">ACTIVE LAYERS</text>
    <rect x="18" y="38" width="144" height="22" rx="4" fill="#1e293b" />
    <circle cx="30" cy="49" r="4" fill="#ec4899" />
    <rect x="42" y="45" width="70" height="8" rx="2" fill="#cbd5e1" />
    
    <rect x="18" y="66" width="144" height="22" rx="4" fill="#1e293b" />
    <circle cx="30" cy="77" r="4" fill="#3b82f6" />
    <rect x="42" y="73" width="85" height="8" rx="2" fill="#cbd5e1" />

    <rect x="18" y="94" width="144" height="20" rx="4" fill="#1e293b" />
    <circle cx="30" cy="104" r="4" fill="#10b981" />
    <rect x="42" y="100" width="50" height="8" rx="2" fill="#cbd5e1" />
  </g>

  <!-- Foreground Content: Titles, Badges, and Descriptions -->
  <g transform="translate(60, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="280" height="30" rx="15" fill="#312e81" stroke="#6366f1" stroke-width="1" />
      <circle cx="16" cy="15" r="5" fill="#a855f7" />
      <text x="30" y="20" fill="#c7d2fe" font-size="12" font-weight="bold" font-family="sans-serif" letter-spacing="0.5">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text class="title-text" x="0" y="135" font-size="44" fill="#ffffff">
      Online Image Editor &amp;
    </text>
    <text class="title-text" x="0" y="185" font-size="44" fill="url(#primaryGrad)">
      Graphic Design Platforms
    </text>

    <!-- Subtitle / Value Proposition -->
    <text class="sub-text" x="0" y="230" font-size="16" fill="#94a3b8">
      A curated collection of industry-leading SaaS solutions &amp; open-source
    </text>
    <text class="sub-text" x="0" y="254" font-size="16" fill="#94a3b8">
      alternatives for browser-based photo editing, vector art, and visual creation.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 285)">
      <!-- Tag 1 -->
      <rect width="112" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="14" y="18" fill="#e2e8f0" font-size="12" font-family="sans-serif">🎨 Vector &amp; Raster</text>

      <!-- Tag 2 -->
      <rect x="122" width="138" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="134" y="18" fill="#e2e8f0" font-size="12" font-family="sans-serif">⚡ Browser &amp; Canvas</text>

      <!-- Tag 3 -->
      <rect x="270" width="132" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="282" y="18" fill="#e2e8f0" font-size="12" font-family="sans-serif">🚀 Open-Source Stars</text>

      <!-- Tag 4 -->
      <rect x="412" width="118" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="424" y="18" fill="#e2e8f0" font-size="12" font-family="sans-serif">💰 Pricing Intel</text>
    </g>
  </g>
</svg>
